<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOEIC Part 5 Quiz</title>
    <link rel="stylesheet" href="src/styles.css?v=pastel-ui-5" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button restart-button" id="restartTopButton" type="button" aria-label="Thoát về màn hình chính" title="Thoát về màn hình chính">
          <span aria-hidden="true">×</span>
        </button>

        <div class="top-metric">
          <span>💬 Câu số</span>
          <strong id="questionCounter">1/30</strong>
        </div>

        <div class="top-metric">
          <span>⏱️ Thời gian còn lại</span>
          <strong id="timerText">12:00</strong>
        </div>
      </header>

      <main class="stage">
        <section class="start-view" id="startView">
          <div class="start-panel">
            <div class="start-kicker">TOEIC Part 5</div>
            <h1>Quiz 30 câu</h1>
            <div class="set-picker" id="setPicker" role="radiogroup" aria-label="Chọn bộ câu hỏi">
              <button class="set-option is-active" type="button" data-set="all" role="radio" aria-checked="true">
                Ngẫu nhiên
                <span>150 câu</span>
              </button>
              <button class="set-option" type="button" data-set="1" role="radio" aria-checked="false">
                Test 1
                <span>30 câu</span>
              </button>
              <button class="set-option" type="button" data-set="2" role="radio" aria-checked="false">
                Test 2
                <span>30 câu</span>
              </button>
              <button class="set-option" type="button" data-set="3" role="radio" aria-checked="false">
                Test 3
                <span>30 câu</span>
              </button>
              <button class="set-option" type="button" data-set="4" role="radio" aria-checked="false">
                Test 4
                <span>30 câu</span>
              </button>
              <button class="set-option" type="button" data-set="5" role="radio" aria-checked="false">
                Test 5
                <span>30 câu</span>
              </button>
            </div>
            <button class="primary-button start-button" id="startButton" type="button">Bắt đầu</button>
            <section class="start-history" id="startHistory" hidden>
              <div class="history-head">
                <strong>Lịch sử luyện tập</strong>
                <span id="startHistorySummary"></span>
              </div>
              <div class="weak-list compact" id="startWeakList"></div>
            </section>
          </div>
        </section>

        <section class="quiz-view" id="quizView" aria-live="polite">
          <div class="question-source" id="questionSource"></div>
          <h1 class="question-text" id="questionText"></h1>
          <div class="options-list" id="optionsList"></div>
          <p class="feedback-line" id="feedbackLine"></p>
        </section>

        <section class="result-view" id="resultView" hidden>
          <div class="score-number" id="scoreNumber"></div>
          <div class="score-badge" id="scoreBadge"></div>
          <div class="score-caption" id="scoreCaption"></div>
          <p class="score-message" id="scoreMessage"></p>
          <div class="result-stats" id="resultStats"></div>
          <div class="result-actions">
            <button class="primary-button" id="restartResultButton" type="button">Làm lại đề mới</button>
          </div>
          <section class="mistake-panel" id="mistakePanel" hidden>
            <div class="history-head">
              <strong>Câu hay mắc lỗi</strong>
              <span>Dựa trên lịch sử làm bài trên máy này</span>
            </div>
            <div class="weak-list" id="mistakeList"></div>
          </section>
          <h2 class="section-title">Chi tiết bài làm</h2>
          <div class="review-list" id="reviewList"></div>
        </section>
      </main>

      <div class="confirm-overlay" id="confirmOverlay" hidden>
        <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
          <h2 id="confirmTitle">Quay về màn hình chính?</h2>
          <p>Bài đang làm sẽ bị hủy và thời gian sẽ dừng lại.</p>
          <div class="confirm-actions">
            <button class="secondary-button" id="cancelLeaveButton" type="button">Tiếp tục làm</button>
            <button class="danger-button" id="confirmLeaveButton" type="button">Đồng ý</button>
          </div>
        </section>
      </div>

      <footer class="actionbar" id="actionbar">
        <button class="nav-button" id="prevButton" type="button" aria-label="Câu trước">
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M15 18 9 12l6-6" />
          </svg>
        </button>
        <button class="answer-button" id="submitButton" type="button" disabled>Trả lời</button>
        <button class="answer-button next-button" id="nextButton" type="button" hidden>Câu tiếp theo</button>
      </footer>
    </div>

    <script src="src/questions.js?v=pastel-ui-5"></script>
    <script src="src/app.js?v=pastel-ui-5"></script>
  </body>
</html>
